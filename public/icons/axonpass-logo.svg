<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Shield Inner Glow Gradient -->
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="1" />
      <stop offset="30%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <!-- Synapse Line Gradient -->
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="coreBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Shield Outer Glow -->
  <path d="M 256 70 
           C 340 70, 396 92, 408 122
           C 408 248, 362 368, 256 438
           C 150 368, 104 248, 104 122
           C 116 92, 172 70, 256 70 Z" 
        fill="none" 
        stroke="url(#shieldBorder)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Shield Inner Layer -->
  <path d="M 256 86 
           C 330 86, 380 105, 390 130
           C 390 238, 350 346, 256 414
           C 162 346, 122 238, 122 130
           C 132 105, 182 86, 256 86 Z" 
        fill="url(#shieldInner)" 
        stroke="#1E3A8A" 
        stroke-width="3" />

  <!-- Inner Trim Accent Line -->
  <path d="M 256 102 
           C 318 102, 362 118, 372 138
           C 372 230, 336 326, 256 388
           C 176 326, 140 230, 140 138
           C 150 118, 194 102, 256 102 Z" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="2" 
        stroke-opacity="0.4" />

  <!-- Neural Synapse Tree Network (Axon Branches) -->
  <!-- Top branches -->
  <path d="M 256 240 L 256 130 M 256 175 L 220 135 M 256 175 L 292 135 M 256 150 L 235 118 M 256 150 L 277 118" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  
  <!-- Top-Right branches -->
  <path d="M 270 235 L 345 170 M 310 200 L 340 215 M 325 188 L 360 160 M 345 170 L 368 185" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Right branches -->
  <path d="M 285 256 L 365 256 M 330 256 L 355 235 M 330 256 L 355 277 M 350 256 L 372 268" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Bottom-Right branches -->
  <path d="M 275 275 L 340 335 M 305 305 L 338 295 M 320 320 L 325 355 M 335 330 L 352 345" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Bottom branches -->
  <path d="M 256 285 L 256 375 M 256 330 L 230 355 M 256 330 L 282 355 M 256 350 L 245 380 M 256 350 L 267 380" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Bottom-Left branches -->
  <path d="M 237 275 L 172 335 M 207 305 L 174 295 M 192 320 L 187 355 M 177 330 L 160 345" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Left branches -->
  <path d="M 227 256 L 147 256 M 182 256 L 157 235 M 182 256 L 157 277 M 162 256 L 140 268" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Top-Left branches -->
  <path d="M 242 235 L 167 170 M 202 200 L 172 215 M 187 188 L 152 160 M 167 170 L 144 185" 
        stroke="url(#synapseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Synapse Node Sparkles / Connection Junctions -->
  <circle cx="256" cy="130" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="220" cy="135" r="3.5" fill="#67E8F9" />
  <circle cx="292" cy="135" r="3.5" fill="#67E8F9" />
  <circle cx="235" cy="118" r="3" fill="#A5F3FC" />
  <circle cx="277" cy="118" r="3" fill="#A5F3FC" />

  <circle cx="345" cy="170" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="360" cy="160" r="3.5" fill="#67E8F9" />
  <circle cx="368" cy="185" r="3" fill="#A5F3FC" />

  <circle cx="365" cy="256" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="355" cy="235" r="3.5" fill="#67E8F9" />
  <circle cx="355" cy="277" r="3.5" fill="#67E8F9" />

  <circle cx="340" cy="335" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="325" cy="355" r="3.5" fill="#67E8F9" />

  <circle cx="256" cy="375" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="230" cy="355" r="3.5" fill="#67E8F9" />
  <circle cx="282" cy="355" r="3.5" fill="#67E8F9" />

  <circle cx="172" cy="335" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="187" cy="355" r="3.5" fill="#67E8F9" />

  <circle cx="147" cy="256" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="157" cy="235" r="3.5" fill="#67E8F9" />
  <circle cx="157" cy="277" r="3.5" fill="#67E8F9" />

  <circle cx="167" cy="170" r="4.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="152" cy="160" r="3.5" fill="#67E8F9" />
  <circle cx="144" cy="185" r="3" fill="#A5F3FC" />

  <!-- Central Quantum / Neural Nucleus (Glow Halo) -->
  <circle cx="256" cy="256" r="72" fill="url(#coreGlow)" filter="url(#coreBloom)" />
  <circle cx="256" cy="256" r="46" fill="#0B132B" stroke="#00F0FF" stroke-width="3" filter="url(#glow)" />

  <!-- Orbital Electron / Synaptic Quantum Rings -->
  <ellipse cx="256" cy="256" rx="34" ry="14" fill="none" stroke="#38BDF8" stroke-width="2" transform="rotate(-30 256 256)" stroke-dasharray="8 4" opacity="0.9" />
  <ellipse cx="256" cy="256" rx="34" ry="14" fill="none" stroke="#22D3EE" stroke-width="2" transform="rotate(30 256 256)" stroke-dasharray="8 4" opacity="0.9" />
  <ellipse cx="256" cy="256" rx="34" ry="14" fill="none" stroke="#818CF8" stroke-width="1.5" transform="rotate(90 256 256)" opacity="0.8" />

  <!-- Pulsing Central Nucleus Core -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="256" cy="256" r="7" fill="#00F0FF" />

  <!-- Orbital Particles -->
  <circle cx="282" cy="241" r="3.5" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="230" cy="271" r="3" fill="#A5F3FC" />
  <circle cx="256" cy="224" r="2.5" fill="#67E8F9" />
</svg>
